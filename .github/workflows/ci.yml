name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  source-policy:
    name: Source policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go 1.26.7
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache: false

      - name: Install pinned ShellCheck
        env:
          SHELLCHECK_ARCHIVE_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/shellcheck-v0.11.0.linux.x86_64.tar.xz"
          bin_dir="$RUNNER_TEMP/bin"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --retry 3 --retry-all-errors \
            --output "$archive" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          printf '%s  %s\n' "$SHELLCHECK_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          install -d -m 0755 "$bin_dir"
          install -m 0755 \
            "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" \
            "$bin_dir/shellcheck"
          echo "$bin_dir" >>"$GITHUB_PATH"

      - name: Validate shell scripts
        run: |
          set -euo pipefail
          bash -n server/install.sh
          for script in \
            docker/compose-up.sh \
            docker/entrypoint.sh \
            server/sing-box-wrapper.sh; do
            dash -n "$script"
          done
          shellcheck --severity=warning \
            server/install.sh \
            docker/compose-up.sh \
            docker/entrypoint.sh \
            server/sing-box-wrapper.sh

      - name: Validate the cloudflared guard
        run: |
          set -euo pipefail
          gofmt -d docker/cloudflared-guard.go | tee "$RUNNER_TEMP/gofmt.diff"
          test ! -s "$RUNNER_TEMP/gofmt.diff"
          GOOS=linux GOARCH=amd64 go vet docker/cloudflared-guard.go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags '-s -w -buildid=' \
            -o "$RUNNER_TEMP/cloudflared-guard" \
            docker/cloudflared-guard.go

  node-tests:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '24.20.0'
          - '24.x'
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: ${{ matrix.node-version == '24.x' }}
          package-manager-cache: false

      - name: Verify the supported Node.js range
        run: |
          node -e '
            const [major, minor] = process.versions.node.split(".").map(Number);
            if (major !== 24 || minor < 20) process.exit(1);
          '

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          find src test -type f -name '*.js' -print0 \
            | sort -z \
            | xargs -0 -n 1 node --check

      - name: Run the full test suite
        run: npm test

      - name: Run the root ownership regression
        if: matrix.node-version == '24.20.0'
        run: |
          set -euo pipefail
          sudo "$(command -v node)" --test \
            --test-reporter=tap \
            --test-name-pattern='^root repository fixes private ownership' \
            test/unit/core-repository-v2.test.js \
            | tee "$RUNNER_TEMP/root-ownership.tap"
          grep -Fx 'ok 1 - root repository fixes private ownership while assigning only projection groups' \
            "$RUNNER_TEMP/root-ownership.tap"
          grep -Fx '# tests 1' "$RUNNER_TEMP/root-ownership.tap"
          grep -Fx '# pass 1' "$RUNNER_TEMP/root-ownership.tap"
          grep -Fx '# skipped 0' "$RUNNER_TEMP/root-ownership.tap"

  compose-policy:
    name: Compose policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      COMPOSE_PROJECT_NAME: vpn-ci-policy
      TS_AUTH_KEY_FILE: /dev/null
      TS_API_KEY_FILE: ''
      CLOUDFLARE_TUNNEL_TOKEN_FILE: /dev/null
      EXIT_NODE: 100.64.0.10
      VPN_PUBLIC_HOSTNAME: vpn.example.com
      SUBSCRIPTION_PUBLIC_BASE_URL: https://sub.example.com
      ADMIN_PUBLIC_HOSTNAME: admin.example.com
      EGRESS_HEALTH_HOST: health.example.net
      WS_PATH: /AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      NODE_NAME: vpn-ci
      MIGRATE_LEGACY: ''
      MIGRATE_REALITY: ''
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require fail-closed bind source declarations
        run: |
          set -euo pipefail
          ruby -ryaml -e '
            compose = YAML.safe_load(
              File.read("docker-compose.yml"),
              permitted_classes: [],
              permitted_symbols: [],
              aliases: false
            )
            expected = [
              ["cloudflared", "/run/secrets/cloudflare-tunnel-token"],
              ["vpn-gateway", "/run/secrets/tailscale-api-key"],
              ["vpn-gateway", "/run/secrets/tailscale-auth-key"]
            ]
            actual = []
            compose.fetch("services").each do |service, definition|
              definition.fetch("volumes", []).each do |volume|
                next unless volume.is_a?(Hash) && volume["type"] == "bind"

                identity = [service, volume["target"]]
                actual << identity
                abort "bind #{identity.join(":")} must disable host-path creation" unless
                  volume.dig("bind", "create_host_path") == false
              end
            end
            abort "unexpected Compose bind mounts" unless actual.sort == expected.sort
          '

      - name: Render the Compose model
        run: |
          set -euo pipefail
          docker compose version
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml config --format json \
            >"$RUNNER_TEMP/compose.json"
          TS_API_KEY_FILE=/dev/null \
            docker compose -f docker-compose.yml config --format json \
            >"$RUNNER_TEMP/compose-api-key.json"

      - name: Enforce the Compose security boundary
        run: |
          set -euo pipefail
          jq --exit-status --arg workspace "$GITHUB_WORKSPACE" '
            def normalize_bind:
              if .type == "bind" and .bind == {} then
                .bind = {"create_host_path": false}
              else
                .
              end;
            (.services["vpn-gateway"].volumes
              | map(normalize_bind)
              | map({key: .target, value: .})
              | from_entries) as $gateway_mounts
            | (.services | keys | sort) == ["cloudflared", "vpn-gateway"]
            and (.services["vpn-gateway"] | keys | sort) == ([
              "build", "cap_add", "cap_drop", "command", "entrypoint",
              "environment", "healthcheck", "image", "init", "logging",
              "networks", "pids_limit", "read_only", "restart",
              "security_opt", "stop_grace_period", "tmpfs", "user",
              "volumes"
            ] | sort)
            and (.services.cloudflared | keys | sort) == ([
              "build", "cap_add", "cap_drop", "command", "depends_on",
              "entrypoint", "healthcheck", "image", "logging",
              "network_mode", "pids_limit", "read_only", "restart",
              "security_opt", "stop_grace_period", "tmpfs", "user",
              "volumes"
            ] | sort)
            and all(
              .services[];
              (has("ports") | not)
              and (has("expose") | not)
              and ((.network_mode // "") != "host")
              and ((.privileged // false) == false)
              and (has("pid") | not)
              and (has("ipc") | not)
              and (has("uts") | not)
              and (has("cgroup") | not)
              and (has("devices") | not)
              and (has("device_cgroup_rules") | not)
              and (has("volumes_from") | not)
              and (has("secrets") | not)
              and (has("configs") | not)
              and (has("use_api_socket") | not)
              and (has("post_start") | not)
              and (has("pre_stop") | not)
              and .entrypoint == null
              and .command == null
              and .read_only == true
              and .cap_drop == ["ALL"]
              and .security_opt == ["no-new-privileges:true"]
              and .user == "0:0"
            )
            and .networks == {
              "default": {
                "name": "vpn-ci-policy_default",
                "ipam": {}
              }
            }
            and .volumes == {
              "vpn-data": {
                "name": "vpn-ci-policy_vpn-data"
              }
            }
            and .services["vpn-gateway"].image == "vpn-gateway:local"
            and .services["vpn-gateway"].build == {
              "context": $workspace,
              "dockerfile": "docker/Dockerfile"
            }
            and (.services["vpn-gateway"] | has("network_mode") | not)
            and .services["vpn-gateway"].networks == {"default": null}
            and .services["vpn-gateway"].init == true
            and .services["vpn-gateway"].pids_limit == 128
            and .services["vpn-gateway"].restart == "unless-stopped"
            and .services["vpn-gateway"].stop_grace_period == "5m30s"
            and .services["vpn-gateway"].tmpfs == [
              "/run:size=4m,mode=0755,nosuid,nodev,noexec",
              "/tmp:size=16m,mode=1777,nosuid,nodev,noexec"
            ]
            and .services["vpn-gateway"].healthcheck == {
              "test": ["CMD", "node", "/app/src/healthcheck.js"],
              "timeout": "10s",
              "interval": "30s",
              "retries": 3,
              "start_period": "20s"
            }
            and .services["vpn-gateway"].logging == {
              "driver": "local",
              "options": {
                "compress": "true",
                "max-file": "3",
                "max-size": "10m"
              }
            }
            and .services.cloudflared.network_mode == "service:vpn-gateway"
            and .services.cloudflared.image == "vpn-cloudflared:local"
            and .services.cloudflared.build == {
              "context": $workspace,
              "dockerfile": "docker/cloudflared.Dockerfile"
            }
            and .services.cloudflared.pids_limit == 64
            and .services.cloudflared.restart == "unless-stopped"
            and .services.cloudflared.stop_grace_period == "45s"
            and .services.cloudflared.depends_on == {
              "vpn-gateway": {
                "condition": "service_started",
                "restart": true,
                "required": true
              }
            }
            and .services.cloudflared.tmpfs == [
              "/tmp:size=4m,mode=1777,nosuid,nodev,noexec"
            ]
            and .services.cloudflared.healthcheck == {
              "test": ["CMD", "/usr/local/bin/cloudflared-guard", "ready"],
              "timeout": "5s",
              "interval": "30s",
              "retries": 3,
              "start_period": "20s"
            }
            and .services.cloudflared.logging == {
              "driver": "local",
              "options": {
                "compress": "true",
                "max-file": "3",
                "max-size": "10m"
              }
            }
            and (.services.cloudflared | has("environment") | not)
            and (.services.cloudflared.cap_add | sort)
              == (["SETGID", "SETPCAP", "SETUID"] | sort)
            and (.services.cloudflared.volumes | map(normalize_bind)) == [{
              "type": "bind",
              "source": "/dev/null",
              "target": "/run/secrets/cloudflare-tunnel-token",
              "read_only": true,
              "bind": {"create_host_path": false}
            }]
            and (.services["vpn-gateway"].cap_add | sort)
              == (["CHOWN", "DAC_OVERRIDE", "FOWNER", "KILL", "SETGID", "SETUID"] | sort)
            and (.services["vpn-gateway"].volumes | length) == 3
            and ([.services["vpn-gateway"].volumes[].target] | sort)
              == (["/data", "/run/secrets/tailscale-api-key", "/run/secrets/tailscale-auth-key"] | sort)
            and $gateway_mounts["/data"] == {
              "type": "volume",
              "source": "vpn-data",
              "target": "/data",
              "volume": {"nocopy": true}
            }
            and $gateway_mounts["/run/secrets/tailscale-auth-key"] == {
              "type": "bind",
              "source": "/dev/null",
              "target": "/run/secrets/tailscale-auth-key",
              "read_only": true,
              "bind": {"create_host_path": false}
            }
            and $gateway_mounts["/run/secrets/tailscale-api-key"] == {
              "type": "bind",
              "source": "/dev/null",
              "target": "/run/secrets/tailscale-api-key",
              "read_only": true,
              "bind": {"create_host_path": false}
            }
            and .services["vpn-gateway"].environment == {
              "ADMIN_GID": "11002",
              "ADMIN_HOST": "127.0.0.1",
              "ADMIN_PORT": "8081",
              "ADMIN_PUBLIC_HOSTNAME": "admin.example.com",
              "ADMIN_UID": "11002",
              "CONTROLLER_SOCKET": "/run/vpn-gateway/controller.sock",
              "DATA_DIR": "/data",
              "EGRESS_HEALTH_HOST": "health.example.net",
              "EXIT_NODE": "100.64.0.10",
              "MIGRATE_LEGACY": "",
              "MIGRATE_REALITY": "",
              "NODE_ENV": "production",
              "NODE_HOST": "127.0.0.1",
              "NODE_NAME": "vpn-ci",
              "NODE_PORT": "8443",
              "SINGBOX_BIN": "/usr/local/bin/sing-box",
              "SINGBOX_CONFIG": "/data/runtime/sing-box.json",
              "SINGBOX_GID": "11000",
              "SINGBOX_STATE_DIR": "/data/tailscale",
              "SINGBOX_UID": "11000",
              "SUBSCRIPTION_PUBLIC_BASE_URL": "https://sub.example.com",
              "SUB_GID": "11001",
              "SUB_HOST": "127.0.0.1",
              "SUB_PORT": "8080",
              "SUB_UID": "11001",
              "SUPERVISE": "1",
              "TS_API_KEY_FILE": "",
              "TS_AUTH_KEY_FILE": "/run/secrets/tailscale-auth-key",
              "VPN_PUBLIC_HOSTNAME": "vpn.example.com",
              "WS_PATH": "/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
            }
          ' "$RUNNER_TEMP/compose.json"

          jq --slurp --exit-status '
            .[0] as $without_api
            | .[1] as $with_api
            | $with_api.services["vpn-gateway"].environment.TS_API_KEY_FILE
                == "/run/secrets/tailscale-api-key"
              and ($with_api
                | .services["vpn-gateway"].environment.TS_API_KEY_FILE = "")
                == $without_api
          ' \
            "$RUNNER_TEMP/compose.json" \
            "$RUNNER_TEMP/compose-api-key.json"

  secret-history:
    name: Secret history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks
        env:
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --retry 3 --retry-all-errors \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"
          printf '[extend]\nuseDefault = true\n' >"$RUNNER_TEMP/gitleaks.toml"
          printf '%s\n' \
            '32a17ce52d93d47559ef0103336e2a44c0795c93:test/unit/core-v2-fixture.js:generic-api-key:32' \
            '32a17ce52d93d47559ef0103336e2a44c0795c93:test/unit/core-validation-v2.test.js:generic-api-key:141' \
            '32a17ce52d93d47559ef0103336e2a44c0795c93:test/unit/migration-v1-v2.test.js:generic-api-key:25' \
            '32a17ce52d93d47559ef0103336e2a44c0795c93:test/integration/controller.test.js:generic-api-key:61' \
            >"$RUNNER_TEMP/gitleaksignore"

      - name: Scan the complete history without disclosing findings
        run: |
          "$RUNNER_TEMP/gitleaks" git \
            --config "$RUNNER_TEMP/gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaksignore" \
            --ignore-gitleaks-allow \
            --max-archive-depth=1 \
            --redact=100 \
            --no-banner \
            --no-color \
            --timeout=120 \
            .

  container-build-validate:
    name: Container build and validation
    needs:
      - source-policy
      - node-tests
      - compose-policy
      - secret-history
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      COMPOSE_PROJECT_NAME: vpn-ci-${{ github.run_id }}-${{ github.run_attempt }}
      TS_AUTH_KEY_FILE: /dev/null
      TS_API_KEY_FILE: ''
      CLOUDFLARE_TUNNEL_TOKEN_FILE: /dev/null
      EXIT_NODE: 100.64.0.10
      VPN_PUBLIC_HOSTNAME: vpn.example.com
      SUBSCRIPTION_PUBLIC_BASE_URL: https://sub.example.com
      ADMIN_PUBLIC_HOSTNAME: admin.example.com
      EGRESS_HEALTH_HOST: health.example.net
      WS_PATH: /AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      NODE_NAME: vpn-ci
      MIGRATE_LEGACY: ''
      MIGRATE_REALITY: ''
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24.20.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          package-manager-cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the gateway image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          tags: vpn-gateway:local
          pull: true
          push: false
          load: true
          provenance: false
          sbom: false
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=vpn-gateway-amd64
          cache-to: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'type=gha,mode=max,scope=vpn-gateway-amd64' || '' }}

      - name: Build the cloudflared image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/cloudflared.Dockerfile
          platforms: linux/amd64
          tags: vpn-cloudflared:local
          pull: true
          push: false
          load: true
          provenance: false
          sbom: false
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=cloudflared-amd64
          cache-to: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'type=gha,mode=max,scope=cloudflared-amd64' || '' }}

      - name: Verify pinned binaries
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint node vpn-gateway:local --version)" = v24.20.0
          docker run --rm --entrypoint /usr/local/bin/sing-box \
            vpn-gateway:local version >"$RUNNER_TEMP/sing-box-version.txt"
          grep -Fx 'sing-box version 1.13.21' "$RUNNER_TEMP/sing-box-version.txt"
          grep -Fx 'Tags: with_gvisor,with_utls,with_tailscale' \
            "$RUNNER_TEMP/sing-box-version.txt"
          docker run --rm --entrypoint /usr/local/bin/cloudflared \
            vpn-cloudflared:local --version >"$RUNNER_TEMP/cloudflared-version.txt"
          grep -Eq '^cloudflared version 2026\.8\.3([[:space:]]|$)' \
            "$RUNNER_TEMP/cloudflared-version.txt"

      - name: Render and check a configuration with the built image
        run: |
          set -euo pipefail
          node test/ci/write-valid-state.js "$RUNNER_TEMP/state.json"
          docker run --rm \
            --entrypoint node \
            --volume "$RUNNER_TEMP/state.json:/tmp/state.json:ro" \
            vpn-gateway:local \
            --input-type=module \
            --eval '
              import { readFile } from "node:fs/promises";
              import { renderSingBoxConfig } from "/app/src/render.js";
              const state = JSON.parse(await readFile("/tmp/state.json", "utf8"));
              process.stdout.write(`${JSON.stringify(renderSingBoxConfig(state), null, 2)}\n`);
            ' >"$RUNNER_TEMP/sing-box.json"
          docker run --rm \
            --entrypoint /usr/local/bin/sing-box \
            --volume "$RUNNER_TEMP/sing-box.json:/tmp/sing-box.json:ro" \
            vpn-gateway:local \
            check -c /tmp/sing-box.json

      - name: Inspect final image contents and metadata
        run: |
          set -euo pipefail
          docker image inspect vpn-gateway:local >"$RUNNER_TEMP/gateway-image.json"
          docker image inspect vpn-cloudflared:local >"$RUNNER_TEMP/tunnel-image.json"

          jq --exit-status '
            .[0].Os == "linux"
            and .[0].Architecture == "amd64"
            and .[0].Config.ExposedPorts == null
            and .[0].Config.User == "root:root"
            and .[0].Config.Entrypoint == ["/app/entrypoint.sh"]
            and .[0].Config.Cmd == null
            and .[0].Config.WorkingDir == "/app"
            and .[0].Config.Volumes == {"/data": {}}
            and .[0].Config.Healthcheck.Test
              == ["CMD", "node", "/app/src/healthcheck.js"]
            and all(.[0].Config.Env[]; test("TOKEN="; "i") | not)
          ' "$RUNNER_TEMP/gateway-image.json"
          jq --exit-status '
            .[0].Os == "linux"
            and .[0].Architecture == "amd64"
            and .[0].Config.ExposedPorts == null
            and .[0].Config.User == "0:0"
            and .[0].Config.Entrypoint
              == ["/usr/local/bin/cloudflared-guard"]
            and .[0].Config.Cmd == ["run"]
            and .[0].Config.Volumes == null
            and .[0].Config.Healthcheck.Test
              == ["CMD", "/usr/local/bin/cloudflared-guard", "ready"]
            and all(.[0].Config.Env[]; test("TOKEN="; "i") | not)
          ' "$RUNNER_TEMP/tunnel-image.json"

          gateway_id="$(docker create vpn-gateway:local)"
          tunnel_id="$(docker create vpn-cloudflared:local)"
          trap 'docker rm -f "$gateway_id" "$tunnel_id" >/dev/null 2>&1 || true' EXIT
          docker export "$gateway_id" | tar -tf - >"$RUNNER_TEMP/gateway-files.txt"
          docker export "$tunnel_id" | tar -tf - >"$RUNNER_TEMP/tunnel-files.txt"

          grep -Fx 'app/package.json' "$RUNNER_TEMP/gateway-files.txt"
          grep -Fx 'app/entrypoint.sh' "$RUNNER_TEMP/gateway-files.txt"
          grep -Fx 'app/src/render.js' "$RUNNER_TEMP/gateway-files.txt"
          grep -Fx 'usr/local/bin/sing-box' "$RUNNER_TEMP/gateway-files.txt"
          grep -Fx 'usr/local/bin/cloudflared' "$RUNNER_TEMP/tunnel-files.txt"
          grep -Fx 'usr/local/bin/cloudflared-guard' "$RUNNER_TEMP/tunnel-files.txt"

          test "$(docker run --rm --entrypoint stat vpn-gateway:local \
            -c '%u:%g:%a:%h' /app/entrypoint.sh)" = '0:0:755:1'
          test "$(docker run --rm --entrypoint stat vpn-gateway:local \
            -c '%u:%g:%a:%h' /app/package.json)" = '0:0:644:1'
          test "$(docker run --rm --entrypoint stat vpn-gateway:local \
            -c '%u:%g:%a:%h' /app/src/render.js)" = '0:0:644:1'
          test "$(docker run --rm --entrypoint stat vpn-gateway:local \
            -c '%u:%g:%a:%h' /usr/local/bin/sing-box)" = '0:0:755:1'

          if grep -Eq '(^|/)(\.env|\.git)(/|$)|^(app/)?tests?(/|$)|^(go|build|root/\.cache/go-build)(/|$)|^usr/local/go(/|$)' \
            "$RUNNER_TEMP/gateway-files.txt"; then
            echo 'The gateway image contains forbidden source or build content.' >&2
            exit 1
          fi
          if grep -Eq '(^|/)(\.env|\.git)(/|$)|^(app/)?tests?(/|$)|^(go|build|root/\.cache/go-build)(/|$)|^usr/local/go(/|$)|cloudflared-guard\.go$' \
            "$RUNNER_TEMP/tunnel-files.txt"; then
            echo 'The cloudflared image contains forbidden source or build content.' >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/gateway-source"
          docker cp "$gateway_id:/app/src/." "$RUNNER_TEMP/gateway-source"
          docker cp "$gateway_id:/app/package.json" "$RUNNER_TEMP/image-package.json"
          docker cp "$gateway_id:/app/entrypoint.sh" "$RUNNER_TEMP/image-entrypoint.sh"
          diff -ru --no-dereference src "$RUNNER_TEMP/gateway-source"
          diff -u package.json "$RUNNER_TEMP/image-package.json"
          diff -u docker/entrypoint.sh "$RUNNER_TEMP/image-entrypoint.sh"

          if docker run --rm vpn-cloudflared:local unsupported \
            >"$RUNNER_TEMP/guard-output.txt" 2>&1; then
            echo 'The guard accepted an unsupported mode.' >&2
            exit 1
          fi
          grep -Fx 'cloudflared credential launcher: unsupported mode' \
            "$RUNNER_TEMP/guard-output.txt"
          test "$(wc -l <"$RUNNER_TEMP/guard-output.txt")" -eq 1

          if docker run --rm \
            --user 0:0 \
            --read-only \
            --tmpfs /tmp:size=4m,mode=1777,nosuid,nodev,noexec \
            --pids-limit 64 \
            --cap-drop ALL \
            --cap-add SETGID \
            --cap-add SETPCAP \
            --cap-add SETUID \
            --security-opt no-new-privileges:true \
            vpn-cloudflared:local ready \
            >"$RUNNER_TEMP/guard-ready-output.txt" 2>&1; then
            echo 'The guard reported a nonexistent readiness endpoint as healthy.' >&2
            exit 1
          fi
          grep -F 'http://127.0.0.1:2000/ready' \
            "$RUNNER_TEMP/guard-ready-output.txt"
          grep -F 'connection refused' "$RUNNER_TEMP/guard-ready-output.txt"
          if grep -Fq 'cloudflared credential launcher:' \
            "$RUNNER_TEMP/guard-ready-output.txt"; then
            echo 'The guard could not execute cloudflared under the Compose security settings.' >&2
            exit 1
          fi

          printf 'synthetic-ci-token\n' >"$RUNNER_TEMP/token-source"
          sudo install -o root -g root -m 0400 \
            "$RUNNER_TEMP/token-source" \
            "$RUNNER_TEMP/cloudflare-tunnel-token"
          if docker run --rm \
            --user 0:0 \
            --read-only \
            --tmpfs /tmp:size=4m,mode=1777,nosuid,nodev,noexec \
            --pids-limit 64 \
            --cap-drop ALL \
            --cap-add SETGID \
            --cap-add SETPCAP \
            --cap-add SETUID \
            --security-opt no-new-privileges:true \
            --mount "type=bind,source=$RUNNER_TEMP/cloudflare-tunnel-token,target=/run/secrets/cloudflare-tunnel-token,readonly" \
            vpn-cloudflared:local run \
            >"$RUNNER_TEMP/guard-run-output.txt" 2>&1; then
            echo 'Cloudflared accepted the synthetic invalid token.' >&2
            exit 1
          fi
          grep -Fx 'Provided Tunnel token is not valid.' \
            "$RUNNER_TEMP/guard-run-output.txt"
          if grep -Fq 'cloudflared credential launcher:' \
            "$RUNNER_TEMP/guard-run-output.txt"; then
            echo 'The guard run path failed before cloudflared parsed the synthetic token.' >&2
            exit 1
          fi

      - name: Inspect stopped Compose containers
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml create --no-build
          gateway_id="$(docker compose -f docker-compose.yml ps -aq vpn-gateway)"
          tunnel_id="$(docker compose -f docker-compose.yml ps -aq cloudflared)"
          gateway_image="$(docker image inspect --format '{{.Id}}' vpn-gateway:local)"
          tunnel_image="$(docker image inspect --format '{{.Id}}' vpn-cloudflared:local)"
          gateway_network="${COMPOSE_PROJECT_NAME}_default"
          test -n "$gateway_id"
          test -n "$tunnel_id"

          docker inspect "$gateway_id" >"$RUNNER_TEMP/gateway-inspect.json"
          docker inspect "$tunnel_id" >"$RUNNER_TEMP/tunnel-inspect.json"
          docker volume inspect "${COMPOSE_PROJECT_NAME}_vpn-data" \
            >"$RUNNER_TEMP/volume-inspect.json"
          jq --exit-status '
            .[0].Driver == "local"
            and (.[0].Options == null or .[0].Options == {})
          ' "$RUNNER_TEMP/volume-inspect.json"

          jq --exit-status \
            --arg gateway_image "$gateway_image" \
            --arg gateway_network "$gateway_network" '
            (.[0].Mounts
              | map({key: .Destination, value: .})
              | from_entries) as $mounts
            | .[0].Image == $gateway_image
            and .[0].Path == "/app/entrypoint.sh"
            and .[0].Args == []
            and .[0].Config.Image == "vpn-gateway:local"
            and .[0].Config.User == "0:0"
            and .[0].Config.Entrypoint == ["/app/entrypoint.sh"]
            and .[0].Config.Cmd == null
            and .[0].Config.WorkingDir == "/app"
            and .[0].Config.Healthcheck.Test
              == ["CMD", "node", "/app/src/healthcheck.js"]
            and .[0].Config.Healthcheck.Interval == 30000000000
            and .[0].Config.Healthcheck.Timeout == 10000000000
            and .[0].Config.Healthcheck.StartPeriod == 20000000000
            and .[0].Config.Healthcheck.Retries == 3
            and .[0].HostConfig.NetworkMode == $gateway_network
            and (.[0].HostConfig.PortBindings | length) == 0
            and (.[0].NetworkSettings.Ports | length) == 0
            and .[0].HostConfig.ReadonlyRootfs == true
            and .[0].HostConfig.PidsLimit == 128
            and .[0].HostConfig.SecurityOpt == ["no-new-privileges:true"]
            and .[0].HostConfig.Privileged == false
            and (.[0].HostConfig.CapAdd | sort)
              == (["CAP_CHOWN", "CAP_DAC_OVERRIDE", "CAP_FOWNER", "CAP_KILL", "CAP_SETGID", "CAP_SETUID"] | sort)
            and .[0].HostConfig.CapDrop == ["ALL"]
            and .[0].HostConfig.PidMode == ""
            and .[0].HostConfig.IpcMode == "private"
            and .[0].HostConfig.CgroupnsMode == "private"
            and ((.[0].HostConfig.Devices // []) | length) == 0
            and ((.[0].HostConfig.VolumesFrom // []) | length) == 0
            and ((.[0].HostConfig.GroupAdd // []) | length) == 0
            and .[0].HostConfig.LogConfig == {
              "Type": "local",
              "Config": {
                "compress": "true",
                "max-file": "3",
                "max-size": "10m"
              }
            }
            and .[0].HostConfig.Tmpfs == {
              "/run": "size=4m,mode=0755,nosuid,nodev,noexec",
              "/tmp": "size=16m,mode=1777,nosuid,nodev,noexec"
            }
            and (.[0].Mounts | length) == 3
            and ($mounts["/data"] | {
              Type, Name, Destination, Driver, RW
            }) == {
              "Type": "volume",
              "Name": (env.COMPOSE_PROJECT_NAME + "_vpn-data"),
              "Destination": "/data",
              "Driver": "local",
              "RW": true
            }
            and ($mounts["/run/secrets/tailscale-auth-key"] | {
              Type, Source, Destination, RW
            }) == {
              "Type": "bind",
              "Source": "/dev/null",
              "Destination": "/run/secrets/tailscale-auth-key",
              "RW": false
            }
            and ($mounts["/run/secrets/tailscale-api-key"] | {
              Type, Source, Destination, RW
            }) == {
              "Type": "bind",
              "Source": "/dev/null",
              "Destination": "/run/secrets/tailscale-api-key",
              "RW": false
            }
            and all(.[0].Config.Env[]; test("TOKEN="; "i") | not)
          ' "$RUNNER_TEMP/gateway-inspect.json"
          jq --exit-status \
            --arg gateway_id "$gateway_id" \
            --arg tunnel_image "$tunnel_image" '
            .[0].Image == $tunnel_image
            and .[0].Path == "/usr/local/bin/cloudflared-guard"
            and .[0].Args == ["run"]
            and .[0].Config.Image == "vpn-cloudflared:local"
            and .[0].Config.User == "0:0"
            and .[0].Config.Entrypoint
              == ["/usr/local/bin/cloudflared-guard"]
            and .[0].Config.Cmd == ["run"]
            and .[0].Config.Healthcheck.Test
              == ["CMD", "/usr/local/bin/cloudflared-guard", "ready"]
            and .[0].Config.Healthcheck.Interval == 30000000000
            and .[0].Config.Healthcheck.Timeout == 5000000000
            and .[0].Config.Healthcheck.StartPeriod == 20000000000
            and .[0].Config.Healthcheck.Retries == 3
            and .[0].HostConfig.NetworkMode == ("container:" + $gateway_id)
            and (.[0].HostConfig.PortBindings | length) == 0
            and (.[0].NetworkSettings.Ports | length) == 0
            and .[0].HostConfig.ReadonlyRootfs == true
            and .[0].HostConfig.PidsLimit == 64
            and .[0].HostConfig.SecurityOpt == ["no-new-privileges:true"]
            and .[0].HostConfig.Privileged == false
            and (.[0].HostConfig.CapAdd | sort)
              == (["CAP_SETGID", "CAP_SETPCAP", "CAP_SETUID"] | sort)
            and .[0].HostConfig.CapDrop == ["ALL"]
            and .[0].HostConfig.PidMode == ""
            and .[0].HostConfig.IpcMode == "private"
            and .[0].HostConfig.CgroupnsMode == "private"
            and ((.[0].HostConfig.Devices // []) | length) == 0
            and ((.[0].HostConfig.VolumesFrom // []) | length) == 0
            and ((.[0].HostConfig.GroupAdd // []) | length) == 0
            and .[0].HostConfig.LogConfig == {
              "Type": "local",
              "Config": {
                "compress": "true",
                "max-file": "3",
                "max-size": "10m"
              }
            }
            and .[0].HostConfig.Tmpfs == {
              "/tmp": "size=4m,mode=1777,nosuid,nodev,noexec"
            }
            and (.[0].Mounts | length) == 1
            and (.[0].Mounts[0] | {
              Type, Source, Destination, RW
            }) == {
              "Type": "bind",
              "Source": "/dev/null",
              "Destination": "/run/secrets/cloudflare-tunnel-token",
              "RW": false
            }
            and all(.[0].Config.Env[]; test("TOKEN="; "i") | not)
          ' "$RUNNER_TEMP/tunnel-inspect.json"

      - name: Remove CI Compose resources
        if: always()
        run: docker compose -f docker-compose.yml down --volumes --remove-orphans

      - name: Install pinned Trivy
        env:
          TRIVY_ARCHIVE_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/trivy_0.74.0_Linux-64bit.tar.gz"
          bin_dir="$RUNNER_TEMP/trivy-bin"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --retry 3 --retry-all-errors \
            --output "$archive" \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          printf '%s  %s\n' "$TRIVY_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" trivy
          chmod 0755 "$bin_dir/trivy"
          test "$("$bin_dir/trivy" --version)" = 'Version: 0.74.0'
          printf '{}\n' >"$RUNNER_TEMP/trivy.yaml"
          : >"$RUNNER_TEMP/trivyignore"
          test ! -e "$RUNNER_TEMP/trivy-secret.yaml"

      - name: Scan both images for secrets
        run: |
          set -euo pipefail
          scan_failed=0
          for image in vpn-gateway:local vpn-cloudflared:local; do
            if "$RUNNER_TEMP/trivy-bin/trivy" \
              --config "$RUNNER_TEMP/trivy.yaml" \
              --cache-dir "$RUNNER_TEMP/trivy-cache" \
              --quiet \
              image \
              --disable-telemetry \
              --image-src docker \
              --scanners secret \
              --image-config-scanners secret \
              --ignorefile "$RUNNER_TEMP/trivyignore" \
              --secret-config "$RUNNER_TEMP/trivy-secret.yaml" \
              --exit-code 1 \
              --format json \
              --output /dev/null \
              --list-all-pkgs=false \
              --no-progress \
              --skip-version-check \
              --timeout 10m \
              "$image"; then
              continue
            else
              echo "Trivy failed or detected a potential secret in $image; details are suppressed." >&2
              scan_failed=1
            fi
          done
          test "$scan_failed" -eq 0

      - name: Scan both images for fixable severe vulnerabilities
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          scan_failed=0
          for image in vpn-gateway:local vpn-cloudflared:local; do
            if "$RUNNER_TEMP/trivy-bin/trivy" \
              --config "$RUNNER_TEMP/trivy.yaml" \
              --cache-dir "$RUNNER_TEMP/trivy-cache" \
              image \
              --disable-telemetry \
              --image-src docker \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --ignorefile "$RUNNER_TEMP/trivyignore" \
              --exit-code 1 \
              --format table \
              --list-all-pkgs=false \
              --no-progress \
              --skip-version-check \
              --timeout 10m \
              "$image"; then
              continue
            else
              scan_failed=1
            fi
          done
          test "$scan_failed" -eq 0

  required:
    name: Required
    if: always()
    needs:
      - source-policy
      - node-tests
      - compose-policy
      - secret-history
      - container-build-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every CI gate to pass
        run: |
          set -euo pipefail
          test '${{ needs.source-policy.result }}' = success
          test '${{ needs.node-tests.result }}' = success
          test '${{ needs.compose-policy.result }}' = success
          test '${{ needs.secret-history.result }}' = success
          test '${{ needs.container-build-validate.result }}' = success
