name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  source-policy:
    name: Source policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go 1.26.7
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache: false

      - name: Install pinned ShellCheck
        env:
          SHELLCHECK_ARCHIVE_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: bash test/ci/install-tool.sh shellcheck

      - name: Validate shell scripts
        run: bash test/ci/validate-shell.sh

      - name: Validate the cloudflared guard
        run: |
          set -euo pipefail
          gofmt -d deploy/docker/cloudflared-guard.go | tee "$RUNNER_TEMP/gofmt.diff"
          test ! -s "$RUNNER_TEMP/gofmt.diff"
          GOOS=linux GOARCH=amd64 go vet deploy/docker/cloudflared-guard.go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags '-s -w -buildid=' \
            -o "$RUNNER_TEMP/cloudflared-guard" \
            deploy/docker/cloudflared-guard.go

  node-tests:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '24.20.0'
          - '24.x'
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: ${{ matrix.node-version == '24.x' }}
          package-manager-cache: false

      - name: Verify the supported Node.js range
        run: |
          node -e '
            const [major, minor] = process.versions.node.split(".").map(Number);
            if (major !== 24 || minor < 20) process.exit(1);
          '

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          find src test -type f -name '*.js' -print0 \
            | sort -z \
            | xargs -0 -n 1 node --check

      - name: Run the full test suite
        run: npm test

      - name: Run the root ownership regression
        if: matrix.node-version == '24.20.0'
        run: |
          set -euo pipefail
          sudo "$(command -v node)" --test \
            --test-reporter=tap \
            --test-name-pattern='^root repository fixes private ownership' \
            test/unit/repository.test.js \
            | tee "$RUNNER_TEMP/root-ownership.tap"
          grep -Fx 'ok 1 - root repository fixes private ownership while assigning only projection groups' \
            "$RUNNER_TEMP/root-ownership.tap"
          grep -Fx '# tests 1' "$RUNNER_TEMP/root-ownership.tap"
          grep -Fx '# pass 1' "$RUNNER_TEMP/root-ownership.tap"
          grep -Fx '# skipped 0' "$RUNNER_TEMP/root-ownership.tap"

      - name: Run the root installation and upgrade regressions
        if: matrix.node-version == '24.20.0'
        run: |
          set -euo pipefail
          sudo "$(command -v node)" --test \
            --test-reporter=tap \
            test/integration/source-layout-upgrade.test.js \
            | tee "$RUNNER_TEMP/root-source-layout.tap"
          grep -Ex '# tests [1-9][0-9]*' "$RUNNER_TEMP/root-source-layout.tap"
          grep -Ex '# pass [1-9][0-9]*' "$RUNNER_TEMP/root-source-layout.tap"
          grep -Fx '# fail 0' "$RUNNER_TEMP/root-source-layout.tap"
          grep -Fx '# skipped 0' "$RUNNER_TEMP/root-source-layout.tap"

  compose-policy:
    name: Compose policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      COMPOSE_PROJECT_NAME: vpn-ci-policy
      TS_AUTH_KEY_FILE: /dev/null
      TS_API_KEY_FILE: ''
      CLOUDFLARE_TUNNEL_TOKEN_FILE: /dev/null
      EXIT_NODE: 100.64.0.10
      VPN_PUBLIC_HOSTNAME: vpn.example.com
      SUBSCRIPTION_PUBLIC_BASE_URL: https://sub.example.com
      ADMIN_PUBLIC_HOSTNAME: admin.example.com
      EGRESS_HEALTH_HOST: health.example.net
      WS_PATH: /AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      NODE_NAME: vpn-ci
      MIGRATE_LEGACY: ''
      MIGRATE_REALITY: ''
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require fail-closed bind source declarations
        run: bash test/ci/validate-compose-declarations.sh

      - name: Render the Compose model
        run: bash test/ci/render-compose-models.sh

      - name: Enforce the Compose security boundary
        run: bash test/ci/validate-compose-models.sh

  secret-history:
    name: Secret history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks
        env:
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: bash test/ci/install-tool.sh gitleaks

      - name: Scan the complete history without disclosing findings
        run: bash test/ci/scan-history.sh

  container-build-validate:
    name: Container build and validation
    needs:
      - source-policy
      - node-tests
      - compose-policy
      - secret-history
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      COMPOSE_PROJECT_NAME: vpn-ci-${{ github.run_id }}-${{ github.run_attempt }}
      TS_AUTH_KEY_FILE: /dev/null
      TS_API_KEY_FILE: ''
      CLOUDFLARE_TUNNEL_TOKEN_FILE: /dev/null
      EXIT_NODE: 100.64.0.10
      VPN_PUBLIC_HOSTNAME: vpn.example.com
      SUBSCRIPTION_PUBLIC_BASE_URL: https://sub.example.com
      ADMIN_PUBLIC_HOSTNAME: admin.example.com
      EGRESS_HEALTH_HOST: health.example.net
      WS_PATH: /AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      NODE_NAME: vpn-ci
      MIGRATE_LEGACY: ''
      MIGRATE_REALITY: ''
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24.20.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          package-manager-cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the gateway image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          tags: vpn-gateway:local
          pull: true
          push: false
          load: true
          provenance: false
          sbom: false
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=vpn-gateway-amd64
          cache-to: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'type=gha,mode=max,scope=vpn-gateway-amd64' || '' }}

      - name: Build the cloudflared image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/cloudflared.Dockerfile
          platforms: linux/amd64
          tags: vpn-cloudflared:local
          pull: true
          push: false
          load: true
          provenance: false
          sbom: false
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=cloudflared-amd64
          cache-to: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'type=gha,mode=max,scope=cloudflared-amd64' || '' }}

      - name: Verify pinned binaries
        run: bash test/ci/verify-image-binaries.sh

      - name: Render and check a configuration with the built image
        run: bash test/ci/verify-image-config.sh

      - name: Verify client-selected exits with the real proxy engine
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --user 11000:11000 --cap-drop ALL \
            --security-opt no-new-privileges:true --pids-limit 128 \
            --tmpfs /tmp:size=64m,mode=1777,nosuid,nodev,noexec \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --entrypoint node vpn-gateway:local \
            /workspace/test/ci/verify-client-exits.js

      - name: Inspect final image contents and metadata
        run: bash test/ci/verify-image-contents.sh

      - name: Inspect stopped Compose containers
        run: bash test/ci/verify-stopped-containers.sh

      - name: Remove CI Compose resources
        if: always()
        run: docker compose -f docker-compose.yml down --volumes --remove-orphans

      - name: Install pinned Trivy
        env:
          TRIVY_ARCHIVE_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        run: bash test/ci/install-tool.sh trivy

      - name: Scan both images for secrets
        run: bash test/ci/scan-image-secrets.sh

      - name: Scan both images for fixable severe vulnerabilities
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bash test/ci/scan-image-vulnerabilities.sh

  required:
    name: Required
    if: always()
    needs:
      - source-policy
      - node-tests
      - compose-policy
      - secret-history
      - container-build-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every CI gate to pass
        run: |
          set -euo pipefail
          test '${{ needs.source-policy.result }}' = success
          test '${{ needs.node-tests.result }}' = success
          test '${{ needs.compose-policy.result }}' = success
          test '${{ needs.secret-history.result }}' = success
          test '${{ needs.container-build-validate.result }}' = success
