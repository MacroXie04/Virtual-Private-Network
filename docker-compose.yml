services:
  vpn-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: vpn-gateway:local
    restart: unless-stopped
    init: true
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 330s
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      CONTROLLER_SOCKET: /run/vpn-gateway/controller.sock
      SUPERVISE: "1"
      MIGRATE_LEGACY: "${MIGRATE_LEGACY:-}"
      TS_AUTH_KEY_FILE: /run/secrets/tailscale-auth-key
      TS_API_KEY_FILE: "${TS_API_KEY_FILE:+/run/secrets/tailscale-api-key}"
      SINGBOX_BIN: /usr/local/bin/sing-box
      SINGBOX_CONFIG: /data/runtime/sing-box.json
      SINGBOX_STATE_DIR: /data/tailscale
      SINGBOX_UID: "11000"
      SINGBOX_GID: "11000"
      SUB_UID: "11001"
      SUB_GID: "11001"
      ADMIN_UID: "11002"
      ADMIN_GID: "11002"
      NODE_PORT: "8443"
      SUB_HOST: 0.0.0.0
      SUB_PORT: "8080"
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: "8081"
      ADMIN_ALLOWED_HOSTS: ${ADMIN_ALLOWED_HOSTS:-admin.vpn.invalid:8444}
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-https://admin.vpn.invalid:8444}
      EXIT_NODE: ${EXIT_NODE:?Set EXIT_NODE in .env}
      VPS_HOST: ${VPS_HOST:?Set VPS_HOST in .env}
      SERVER_NAME: ${SERVER_NAME:?Set SERVER_NAME in .env}
      NODE_NAME: ${NODE_NAME:-vps-reality}
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
    ports:
      - "443:8443/tcp"
      - "127.0.0.1:8080:8080/tcp"
      - "127.0.0.1:8081:8081/tcp"
    volumes:
      - type: volume
        source: vpn-data
        target: /data
        volume:
          nocopy: true
      - type: bind
        source: ${TS_AUTH_KEY_FILE:-/dev/null}
        target: /run/secrets/tailscale-auth-key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TS_API_KEY_FILE:-/dev/null}
        target: /run/secrets/tailscale-api-key
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /run:size=4m,mode=0755,nosuid,nodev,noexec
      - /tmp:size=16m,mode=1777,nosuid,nodev,noexec
    healthcheck:
      test: ["CMD", "node", "/app/src/healthcheck.js"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
        compress: "true"

volumes:
  vpn-data:
