services:
  vpn-gateway:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: vpn-gateway:local
    restart: unless-stopped
    init: true
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 330s
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      CONTROLLER_SOCKET: /run/vpn-gateway/controller.sock
      SUPERVISE: "1"
      MIGRATE_LEGACY: "${MIGRATE_LEGACY:-}"
      MIGRATE_REALITY: "${MIGRATE_REALITY:-}"
      TS_AUTH_KEY_FILE: /run/secrets/tailscale-auth-key
      TS_API_KEY_FILE: "${TS_API_KEY_FILE:+/run/secrets/tailscale-api-key}"
      SINGBOX_BIN: /usr/local/bin/sing-box
      SINGBOX_CONFIG: /data/runtime/sing-box.json
      SINGBOX_STATE_DIR: /data/tailscale
      SINGBOX_UID: "11000"
      SINGBOX_GID: "11000"
      SUB_UID: "11001"
      SUB_GID: "11001"
      ADMIN_UID: "11002"
      ADMIN_GID: "11002"
      NODE_HOST: 127.0.0.1
      NODE_PORT: "8443"
      SUB_HOST: 127.0.0.1
      SUB_PORT: "8080"
      ADMIN_HOST: 127.0.0.1
      ADMIN_PORT: "8081"
      VPN_PUBLIC_HOSTNAME: ${VPN_PUBLIC_HOSTNAME:?Set VPN_PUBLIC_HOSTNAME in .env}
      SUBSCRIPTION_PUBLIC_BASE_URL: ${SUBSCRIPTION_PUBLIC_BASE_URL:?Set SUBSCRIPTION_PUBLIC_BASE_URL in .env}
      ADMIN_PUBLIC_HOSTNAME: ${ADMIN_PUBLIC_HOSTNAME:?Set ADMIN_PUBLIC_HOSTNAME in .env}
      WS_PATH: "${WS_PATH:-}"
      EGRESS_HEALTH_HOST: ${EGRESS_HEALTH_HOST:?Set EGRESS_HEALTH_HOST in .env}
      EXIT_NODE: ${EXIT_NODE:?Set EXIT_NODE in .env}
      NODE_NAME: ${NODE_NAME:-vps-cloudflare}
    volumes:
      - type: volume
        source: vpn-data
        target: /data
        volume:
          nocopy: true
      - type: bind
        source: ${TS_AUTH_KEY_FILE:-/dev/null}
        target: /run/secrets/tailscale-auth-key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TS_API_KEY_FILE:-/dev/null}
        target: /run/secrets/tailscale-api-key
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /run:size=4m,mode=0755,nosuid,nodev,noexec
      - /tmp:size=16m,mode=1777,nosuid,nodev,noexec
    healthcheck:
      test: ["CMD", "node", "/app/src/runtime/healthcheck.js"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
        compress: "true"

  cloudflared:
    build:
      context: .
      dockerfile: deploy/docker/cloudflared.Dockerfile
    image: vpn-cloudflared:local
    restart: unless-stopped
    # The launcher starts as root only long enough to open and validate the
    # root-only token, then irrevocably execs cloudflared as 65532:65532.
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETPCAP
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    stop_grace_period: 45s
    network_mode: "service:vpn-gateway"
    depends_on:
      vpn-gateway:
        condition: service_started
        restart: true
    volumes:
      - type: bind
        source: ${CLOUDFLARE_TUNNEL_TOKEN_FILE:?Set CLOUDFLARE_TUNNEL_TOKEN_FILE in .env}
        target: /run/secrets/cloudflare-tunnel-token
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=4m,mode=1777,nosuid,nodev,noexec
    healthcheck:
      test: ["CMD", "/usr/local/bin/cloudflared-guard", "ready"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
        compress: "true"

volumes:
  vpn-data:
